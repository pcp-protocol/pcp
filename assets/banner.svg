<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Portable Context Protocol: profile, memory and connections, behind one URL you control.">
  <rect width="1200" height="360" fill="#F4F6F9"/>

  <!-- mark: context handed from one place to another -->
  <g transform="translate(84,100) scale(1.6)">
    <rect x="12" y="12" width="52" height="52" rx="12" fill="none" stroke="#185FA5" stroke-width="8"/>
    <rect x="36" y="36" width="52" height="52" rx="12" fill="#185FA5"/>
  </g>

  <!-- kicker -->
  <text x="300" y="150" fill="#185FA5" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" letter-spacing="3">OPEN PROTOCOL · v0.3</text>

  <!-- wordmark -->
  <text x="298" y="212" fill="#12243A" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700">Portable Context Protocol</text>

  <!-- tagline -->
  <text x="300" y="256" fill="#4B5A6B" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22">Profile, memory and connections, behind one URL you control.</text>
</svg>
